name: Publish docs

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect docs changes since previous tag
        id: diff
        shell: bash
        run: |
          set -eu
          current_tag="${GITHUB_REF_NAME}"
          current_commit="$(git rev-list -n 1 "$current_tag")"

          previous_tag="$(git tag --sort=-creatordate | awk -v t="$current_tag" '$0 != t { print; exit }')"
          if [ -z "$previous_tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_commit="$(git rev-list -n 1 "$previous_tag")"
          if git diff --name-only "$previous_commit" "$current_commit" -- docs/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: docs-changed
    if: needs.docs-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Configure Git for release docs publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build versioned docs with mike
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest
